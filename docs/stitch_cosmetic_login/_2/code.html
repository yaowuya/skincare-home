<!-- Left Side: Hero Image -->
<div class="hidden md:flex w-1/2 relative bg-surface-container-high h-full items-center justify-center overflow-hidden">
<div class="absolute inset-0 bg-primary/10 z-10 mix-blend-multiply"></div>

<div class="relative z-20 p-12 flex flex-col justify-end h-full w-full bg-gradient-to-t from-primary/80 to-transparent">
<div class="text-on-primary max-w-lg">
<h2 class="font-headline-xl text-headline-xl mb-4">形态之美，精准把握。</h2>
<p class="font-body-lg text-body-lg opacity-90">访问业内最严谨的专业数据库。为理性的头脑量身打造。</p>
</div>
</div>
</div>

<div class="w-full md:w-1/2 bg-surface h-full flex items-center justify-center p-8 md:p-16 lg:p-24 relative">
<!-- Back to main app context affordance (Optional, keeping it minimal) -->
<a class="absolute top-8 right-8 text-outline hover:text-primary transition-colors flex items-center gap-2 font-label-md text-label-md" href="#"><span class="material-symbols-outlined text-xl">arrow_back</span>
                首页
            </a>
<div class="w-full max-w-md">
<!-- Brand Anchor -->
<div class="mb-12">
<h1 class="font-headline-lg text-headline-lg text-primary font-bold mb-2">CosmeticLab</h1>
<p class="font-body-md text-body-md text-on-surface-variant">登录您的专业账号。</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="email">电子邮箱</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">mail</span>
</div>
<input class="input-rhine block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="email" name="email" placeholder="professional@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface font-semibold" for="password">密码</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">忘记密码？</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">lock</span>
</div>
<input class="input-rhine block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:ring-0 focus:outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded rounded-[4px] bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">保持登录状态 30 天</label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">登录</button>
</form>
<!-- Registration Prompt -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">还没有账号？ 
                        <a class="font-label-md text-label-md text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">请求访问权限</a></p>
</div>
