<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(195, 198, 209, 0.5);
            box-shadow: 0 8px 32px rgba(0, 51, 102, 0.08);
        }

<body class="bg-surface text-on-surface min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar Suppressed for Transactional Intent -->
<main class="flex-1 flex flex-col md:flex-row min-h-screen w-full">
<!-- Left Side: Hero Image -->
<div class="hidden md:flex flex-1 relative bg-surface-container-high overflow-hidden items-center justify-center">
<!-- Ensure image fills container -->
<img alt="CosmeticLab Professional Environment" class="absolute inset-0 w-full h-full object-cover opacity-90 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbTP0ot6OzpNUXLv3gVOu7I0_8KwIk7tlNFJivrOTMp4dUVoIJOaroI0_rzFceQn3Y-zDlFTURxLcNPEqhZkiqnhHpYOH0LVvO_dEW44dqqWIaX07PplXkD8UkgRWO0J49gtwgQ7wf0wI-INhqB-YB-HL3xE-A_Ubx-lqJD7fe9XfWh8hSZqCiHk1BBWiPcUfgKqX10HiL0_PoWw--N3Dat0y7YGjRoibIpCxCxUZ_2oxbYUCmeG4UCIBzTVIgTcKooP8G9iuNKVrB"/>
<!-- Subtle Overlay for text legibility if needed, though mostly visual -->
<div class="absolute inset-0 bg-primary/10"></div>
<div class="relative z-10 p-12 max-w-lg text-primary text-center">
<h2 class="font-headline-xl text-headline-xl mb-6 text-on-secondary shadow-sm">版搢理内按所有酄改</h2>
<p class="font-body-lg text-body-lg text-on-secondary/90">刐入 CosmeticLab 䄱䅁冕北卅儐儱冕䈵䈔䄒䈔䄱䅁領先的成分匓咉酄改儷儷。</p>
</div>
</div>
<!-- Right Side: Registration Form -->
<div class="flex-1 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-12 bg-surface">
<div class="w-full max-w-md mx-auto">
<!-- Brand Anchor -->
<div class="mb-10 text-center md:text-left">
<span class="font-headline-lg text-headline-lg text-primary tracking-tight">CosmeticLab</span>
</div>
<div class="glass-panel p-8 rounded-xl">
<div class="mb-8">
<h1 class="font-headline-md text-headline-md text-primary mb-2">创建账户</h1>
<p class="font-body-md text-body-md text-on-surface-variant">输入您的详细信息以注册专业账户。</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="fullName">全名</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder-on-surface-variant/50" id="fullName" name="fullName" placeholder="张三" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">专业邮箱</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder-on-surface-variant/50" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">密码</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant">必须至少包含 8 个字竆，并且包含数字和符号。</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-6">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">我同意 <a class="text-primary hover:underline font-label-md text-label-md" href="#">服务条款</a> 和 <a class="text-primary hover:underline font-label-md text-label-md" href="#">隐私政策</a>。</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3 px-4 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:bg-primary-container hover:shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">创建账户</button>
<!-- Divider -->
<div class="relative flex py-5 items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 text-outline-variant font-label-sm text-label-sm uppercase tracking-wider">Or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Secondary Action -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">已有账户？ <a class="font-label-md text-label-md text-primary hover:underline decoration-2 underline-offset-4 transition-all" href="#">在此登录</a></p>
</div>
</form>
</div>
</div>
</div>
</main>
<!-- Footer Suppressed for Transactional Intent to keep focus on registration -->
</body></html>
