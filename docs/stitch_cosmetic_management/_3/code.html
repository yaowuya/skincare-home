<body class="antialiased bg-background font-body-md h-screen w-screen overflow-hidden relative">
<!-- Background Screen (User Management Page) -->
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBq2vt4xYbY_WtZsExXcnmaTrEzm1r5Rg49m4N1fYtrPDSmMMZgxWL8UGWrL2mFIYCCFpGO8RIgoDc2pR0PuOAWmog0zV2TJHj1fMU0lWcN5Y8b10GrWFDRnCyPZK5RbhnXn26f_y2EgQ4JKEgkVuELHAC2DIPRtZ2255ieTRL5Vx_s7jGMzIQNLUjEg0J9KSEfeuaT9D1O5cuaaHIvjEwJy318BvQi-4cQRQwl2Uh8Qs2qnEki-H19WFtIS_ucx5otKJchH9q-T8zl');"></div>

<!-- Modal Container -->
<div class="absolute inset-0 flex items-center justify-center z-50 p-4 sm:p-0">
<!-- Modal Dialog -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface/95 backdrop-blur-md rounded-xl shadow-[0_24px_48px_rgba(0,51,102,0.15)] border border-outline-variant/30 w-full max-w-[480px] flex flex-col overflow-hidden transform transition-all duration-300 scale-100 opacity-100" role="dialog">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-outline-variant/20">
<h2 class="font-headline-md text-headline-md text-primary m-0 tracking-tight" id="modal-title">新增用户</h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-primary transition-colors duration-200 rounded-full p-1 hover:bg-surface-container-low" type="button">
<span class="material-symbols-outlined block" style="font-size: 24px;">close</span>
</button>
</div>
<!-- Body (Form) -->
<div class="px-6 py-6 overflow-y-auto">
<form class="flex flex-col gap-5">
<!-- Username Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="username">用户名</label>
<input class="w-full h-10 px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm" id="username" name="username" placeholder="请输入用户姓名" type="text"/>
</div>
<!-- Role Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="role">角色</label>
<div class="relative">
<select class="w-full h-10 pl-3 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm cursor-pointer" id="role" name="role">
<option disabled="" hidden="" selected="" value="">请选择角色</option>
<option value="product_manager">产品经理</option>
<option value="formula_analyst">配方分析师</option>
<option value="chief_researcher">首席研究员</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 20px;">expand_more</span>
</div>
</div>
</div>
<!-- Registration Date Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="reg_date">注册日期</label>
<input class="w-full h-10 px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm cursor-pointer" id="reg_date" name="reg_date" type="date"/>
</div>
</form>
</div>
<!-- Footer (Actions) -->
<div class="px-6 py-5 bg-surface-container-low/50 border-t border-outline-variant/20 flex justify-end gap-3 rounded-b-xl">
<button class="px-5 py-2.5 rounded-lg font-label-md text-label-md text-on-surface-variant border border-outline-variant/60 bg-surface-container-lowest hover:bg-surface-container-low hover:text-on-surface transition-all duration-200" type="button">
                    Cancel

<button class="px-5 py-2.5 rounded-lg font-label-md text-label-md text-on-primary bg-primary hover:bg-primary/90 shadow-sm active:scale-[0.98] transition-all duration-200" type="button">
                    Confirm
