services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    env_file: .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      - UPLOAD_FOLDER=/app/uploads
      - SECRET_KEY=${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET:-${SECRET_KEY}}
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
